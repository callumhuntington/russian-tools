<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский — Имена</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Русский">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/fonts.css?v=3.5">
<link rel="stylesheet" href="css/app.css?v=3.5">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="js/icons.js?v=3.5"></script>
<script src="js/common.js?v=3.5"></script>
<script src="data/names.js?v=3.5"></script>
<script src="js/names-bank.js?v=3.5"></script>
<script>
// Names: 10 typed-answer questions on familiar forms and patronymics, weighted towards weak ones.
const ROUND = 10;
const BANK = buildNameQuestions();
const norm = s => s.trim().toLowerCase().replace(/ё/g, 'е');
let round = [], idx = 0, score = 0, answered = false;

function start() {
  round = weightedPick(BANK, q => q.key, ROUND, NAMES_NS);
  idx = 0; score = 0;
  show();
}

function show() {
  const q = round[idx];
  answered = false;
  $('#app').innerHTML = header('Имена', `${idx + 1} / ${ROUND}`, 'exercises.html', 'Упражнения') + '<div class="track"><i></i></div>' + `
    <section class="box">
      ${sectionHead(idx + 1, q.title, '', q.context)}
      <div class="prompt">${t(q.q)}</div>
      <div class="inrow">
        <input class="line-in" id="ans" placeholder="…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="ru">
        <button class="btn" id="check">Check</button>
      </div>
      <div id="after"></div>
    </section>`;
  setTrack((idx + 1) / ROUND);
  const inp = $('#ans');
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
  $('#check').onclick = submit;
  inp.focus({ preventScroll: true });
}

function submit() {
  if (answered) return;
  const q = round[idx], inp = $('#ans');
  if (!inp.value.trim()) return;
  answered = true;
  const ok = norm(inp.value) === norm(q.a);
  if (ok) score++;
  bump(NAMES_NS, q.key, ok);
  inp.disabled = true; inp.className = 'line-in ' + (ok ? 'ok' : 'no');
  $('#check').hidden = true;
  const last = idx === ROUND - 1;
  $('#after').innerHTML = `
    <div class="fb ${ok ? 'ok' : 'no'}">${icon(ok ? 'tick' : 'cross')}<span>${ok ? 'Правильно!' : `The answer is ${t(q.a)}`}</span></div>
    ${q.fact ? `<div class="fact">${esc(q.fact)}</div>` : ''}
    <div class="btns"><button class="btn" id="next">${last ? 'Итог' : 'Дальше'}${icon('next')}</button></div>`;
  $('#next').onclick = next;
  $('#next').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next() {
  idx++;
  if (idx < ROUND) { show(); window.scrollTo(0, 0); return; }
  $('#app').innerHTML = header('Имена', `${score} / ${ROUND}`, 'exercises.html', 'Упражнения') + resultsBox(score, ROUND, 'exercises.html', 'Упражнения');
  $('#again').onclick = () => { start(); window.scrollTo(0, 0); };
}

start();
</script>
</body>
</html>
