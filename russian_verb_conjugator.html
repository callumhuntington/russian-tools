<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский — Глаголы</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Русский">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/fonts.css?v=3.6">
<link rel="stylesheet" href="css/app.css?v=3.6">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="js/icons.js?v=3.6"></script>
<script src="js/common.js?v=3.6"></script>
<script src="data/verbs.js?v=3.6"></script>
<script>
// Verb conjugator: 3 random verbs, type all six present-tense forms of each.
const ROUND = 3;
const PRONOUNS = ['я', 'ты', 'он / она', 'мы', 'вы', 'они'];
const SPOKEN = ['я', 'ты', 'он', 'мы', 'вы', 'они'];
const norm = s => s.trim().toLowerCase().replace(/ё/g, 'е');

let round = [], idx = 0, total = 0, state = [], revealed = false;

function start() {
  round = shuffle(VERBS).slice(0, ROUND);
  idx = 0; total = 0;
  show();
}

function show() {
  const v = round[idx];
  state = Array(6).fill(null); revealed = false;
  $('#app').innerHTML = header('Глаголы', `${total} / ${ROUND * 6}`, 'exercises.html', 'Упражнения') + '<div class="track"><i></i></div>' + `
    <section class="box">
      ${sectionHead(idx + 1, 'Спряжение', 'Напишите все формы.', 'type the present tense')}
      <div class="verb">
        <div class="inf"><span class="ru">${esc(v.inf)}</span><button class="speak" id="say" aria-label="Listen">${icon('sound')}</button></div>
        <div class="tr">${esc(v.tr)}</div>
        <div class="stem" id="stem"><button class="btn quiet" id="showstem">Show stem</button></div>
      </div>
      <div class="conj">
        ${PRONOUNS.map((p, i) => `<div class="crow">
          <span class="p">${p}</span>
          <input class="line-in" id="in${i}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="ru">
          <span class="mark" id="mk${i}"></span>
          <button class="speak" id="sp${i}" aria-label="Listen">${icon('sound')}</button>
        </div>`).join('')}
      </div>
      <div id="fb"></div>
      <div class="btns">
        <button class="btn quiet" id="reveal">Show answers</button>
        <button class="btn" id="next" hidden>${idx === ROUND - 1 ? 'Итог' : 'Дальше'}${icon('next')}</button>
      </div>
    </section>`;
  setTrack((idx + 1) / ROUND);
  $('#say').onclick = () => speak(v.inf);
  $('#showstem').onclick = () => { $('#stem').innerHTML = `Stem <b class="ru">${esc(v.stem)}</b> <span class="dim">· ${esc(v.type)}</span>`; };
  PRONOUNS.forEach((_, i) => {
    const inp = $('#in' + i);
    inp.oninput = () => check(i);
    inp.onkeydown = e => { if (e.key === 'Enter') { const n = $('#in' + (i + 1)); if (n) n.focus(); else inp.blur(); } };
    $('#sp' + i).onclick = () => speak(SPOKEN[i] + ' ' + v.answers[i]);
  });
  $('#reveal').onclick = reveal;
  $('#next').onclick = next;
  $('#in0').focus({ preventScroll: true });
}

function mark(i, kind) {
  const m = $('#mk' + i);
  m.className = 'mark ' + (kind || '');
  m.innerHTML = kind === 'ok' ? icon('tick') : kind === 'no' ? icon('cross') : kind === 'shown' ? icon('next') : '';
  $('#sp' + i).classList.toggle('on', kind === 'ok' || kind === 'shown');
}

function check(i) {
  if (revealed) return;
  const v = round[idx], inp = $('#in' + i), val = inp.value;
  const was = state[i] === true;
  if (!val.trim()) { state[i] = null; inp.className = 'line-in'; mark(i, null); }
  else if (norm(val) === norm(v.answers[i])) { state[i] = true; inp.className = 'line-in ok'; mark(i, 'ok'); }
  else { state[i] = false; inp.className = 'line-in no'; mark(i, 'no'); }
  if (!was && state[i] === true) total++;
  if (was && state[i] !== true) total--;
  setMeta(`${total} / ${ROUND * 6}`);
  if (state.every(s => s === true)) finish(true);
}

function reveal() {
  if (revealed) return;
  const v = round[idx];
  state.forEach((s, i) => {
    const inp = $('#in' + i);
    if (s !== true) { inp.value = v.answers[i]; inp.className = 'line-in shown'; mark(i, 'shown'); }
  });
  finish(false);
}

function finish(allRight) {
  revealed = true;
  $$('.line-in').forEach(i => i.disabled = true);
  $('#reveal').hidden = true;
  $('#next').hidden = false;
  $('#fb').innerHTML = allRight
    ? `<div class="fb ok">${icon('tick')}<span>Всё правильно! All six forms right.</span></div>`
    : `<div class="fb shown">${icon('next')}<span>Forms in grey were filled in for you.</span></div>`;
  $('#next').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next() {
  idx++;
  if (idx < ROUND) { show(); window.scrollTo(0, 0); return; }
  $('#app').innerHTML = header('Глаголы', `${total} / ${ROUND * 6}`, 'exercises.html', 'Упражнения') + resultsBox(total, ROUND * 6, 'exercises.html', 'Упражнения');
  $('#again').onclick = () => { start(); window.scrollTo(0, 0); };
}

start();
</script>
</body>
</html>
