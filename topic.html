<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский — Тема</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Русский">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/fonts.css?v=3.5">
<link rel="stylesheet" href="css/app.css?v=3.5">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="js/icons.js?v=3.5"></script>
<script src="js/common.js?v=3.5"></script>
<script src="data/bank.js?v=3.5"></script>
<script src="data/reading.js?v=3.5"></script>
<script src="data/notes.js?v=3.5"></script>
<script>
// One topic: all of it mixed, each exercise type on its own, and its reading texts.
const tid = (location.hash.match(/t-([a-z]+)/) || [, 'privet'])[1];
window.onhashchange = () => location.reload();
const tp = TOPICS.find(x => x.id === tid) || TOPICS[0];
const items = BANK.filter(i => i.topic === tp.id);
const texts = PASSAGES.filter(p => p.topic === tp.id);
const types = TYPES.filter(ty => items.some(i => i.type === ty.id));

$('#app').innerHTML = header(tp.title, '', 'topics.html', 'Темы') +
  (NOTES[tp.id] ? card(`notes.html#t-${tp.id}`, 'vocab', 'Заметки', 'Short notes: the patterns, examples and traps.') : '') +
  card(`quiz.html#t-${tp.id}`, 'all', 'Всё', `20 questions mixed from the whole topic (${items.length} in all).`, bar(progress(NS, items.map(i => i.id)))) +
  `<section class="box">${sectionHead(0, 'Упражнения', 'Выберите упражнение.', 'one kind at a time')}
    <div class="list">${types.map((ty, n) => {
      const its = items.filter(i => i.type === ty.id);
      return `<a class="item" href="quiz.html#t-${tp.id}-x-${ty.id}">
        <span class="n">${n + 1}.</span>
        <div class="t"><div class="nm"><span class="ru">${esc(ty.title)}</span> <span class="dim">${esc(ty.en)} · ${its.length}</span></div>
        ${bar(progress(NS, its.map(i => i.id)))}</div>${icon('next', 'ic go')}</a>`;
    }).join('')}</div></section>` +
  (texts.length ? `<section class="box">${sectionHead(0, 'Чтение', 'Прочитайте текст.', 'read, tap words, answer questions')}
    <div class="list">${texts.map((p, n) => `<a class="item" href="reading.html#p-${p.id}">
      <span class="n">${n + 1}.</span><div class="t"><div class="nm"><span class="ru">${esc(p.title)}</span> <span class="dim">${esc(p.difficulty || '')}</span></div></div>
      ${icon('next', 'ic go')}</a>`).join('')}</div></section>` : '');
</script>
</body>
</html>
